name: fetch-map-data

# Caminho principal (substitui o process-kml.yml/Drive, mantido como
# fallback): fetch directo aos vector tiles da Squadrats, sem export manual.
# 2x/dia (2026-08-08, subiu de 1x): com a cache de cobertura (tiles_fetch.py)
# uma corrida normal já só custa ~2032 pedidos, não os ~6274 de antes — 2x/dia
# fica em ~4064/dia, ainda abaixo do regime antigo de 1x/dia sem cache.
# Motivo de subir: encolher a janela entre uma actividade acontecer e ser
# detectada — um atleta que sincroniza tarde ficava com o ganho atribuído ao
# dia da corrida seguinte, não ao dia real (ver daily_gains.py). Não subir
# mais sem recalcular o orçamento de pedidos/dia primeiro.
# Horas escolhidas (13h/22h UTC, não 6h/18h) para a corrida tardia ficar
# perto do fim do dia em Lisboa — apanha a maior parte do dia antes de
# qualquer detecção transitar para o dia seguinte (o "dia" do
# daily_gains.py é sempre por data UTC no INÍCIO da corrida, não hora
# local, ver fetch_club_koms.py). 22h UTC e não 23h de propósito: dá 2h de
# folga até à meia-noite UTC (a fronteira real que importa, não a meia-
# -noite local) para absorver um eventual atraso do GitHub Actions a
# disparar o cron agendado — sem SLA documentado sobre isso, e sem essa
# folga um atraso conseguia empurrar o início da corrida para o dia UTC
# seguinte, o que nenhum código nosso consegue proteger (a fronteira fica
# ultrapassada antes de o script sequer arrancar).
# Commit condicional (git diff --quiet) garante que corridas sem
# sincronização nova não geram ruído nenhum, só custo de correr.
# TODO: trigger por atividade real (Garmin/Strava/intervals.icu/calendário)
# em vez de tempo fixo, para não haver atraso entre sincronizar e o mapa
# atualizar — precisa de webhook novo, não implementado ainda (ver README
# das regras de uso do endpoint antes de desenhar isso).
# Minuto 7, não 0 (2026-08-10): ao minuto 0 em ponto é o pico de carga
# documentado do scheduler do GitHub Actions — a corrida das 13h chegou a
# atrasar-se ~52min nesse dia, e uma corrida nem chegou a disparar sozinha
# (só correu porque foi accionada à mão). Não muda as horas (13h/22h) nem
# a folga até à meia-noite UTC explicada acima (fica ~1h53 em vez de 2h,
# perda insignificante), só desvia do minuto mais concorrido.
# Nota (2026-08-12): não elimina o atraso, só afasta-o do pico — mesmo já
# no minuto 7, dia 11 Ago houve corridas ~50min e ~1h16 depois da hora
# marcada. Sem SLA do GitHub sobre isto, este desvio é mitigação, não cura.
# Dados numa branch própria, não no master (2026-08-14): antes, cada corrida
# comitava os JSONs directamente no master — cada commit disparava rebuild
# completo do Pages (clássico, serve do master), e qualquer push nosso a
# código ao mesmo tempo que o cron corria colidia com o commit do bot
# (aconteceu de facto: `git pull --rebase` com conflito a meio de um fix).
# Agora o bot só toca na branch `data`; código e docs continuam a viver só no
# master. Os 3 consumidores (squadrats-map/index.html, club.html,
# folha-do-clube) passam a ler de raw.githubusercontent.com/.../data/...
# (branch `data`) em vez do URL do Pages — serve o JSON na hora, sem rebuild
# nenhum, e sem risco de colidir com commits de código.
# Histórico git dos dados mantém-se (a branch `data` continua com commits
# normais) — o backfill_daily_gains.py continua a poder reconstruir a partir
# daí se for preciso.
# 2x/dia -> 6x/dia (2026-08-14), a seguir ao probe de 1 pedido do
# tiles_fetch.py (ver README): sem o probe, 6x/dia custaria ~6x mais no pior
# caso (~12.2k pedidos/dia). Com ele, correr mais vezes não multiplica o
# custo por correr mais vezes — só paga o scan completo de quem realmente
# mudou, e isso não acontece mais vezes só porque se verifica mais vezes.
# Corridas "paradas" custam ~5 pedidos (1 probe/atleta) cada.
# Horas mantidas: 13h07 e 22h07 UTC continuam as âncoras originais (ver
# comentário acima sobre a folga até à meia-noite UTC); as 4 novas (1h/5h/
# 9h/17h) preenchem o resto do dia em intervalos de ~4h. Passo intermédio de
# propósito, não 1x/hora logo — subir de 2 para 6 primeiro, confirmar uns
# dias sem 500s/lentidão nova (mesmo critério já usado para a concorrência),
# só depois considerar ir mais além.
on:
  # schedule TEMPORARIAMENTE desactivado durante a reescrita de histórico
  # (lote de autoria, 28 Ago 2026). Reactivar logo após o force-push de
  # master + data. Cron original:
  #   - cron: "7 1,5,9,13,17,22 * * *" # 6x/dia, de 4 em 4h aprox., minuto 7 (ver nota acima)
  workflow_dispatch: {} # para correr manualmente sem esperar pelo cron

concurrency:
  group: squadrats-data-push
  cancel-in-progress: false

env:
  # os únicos ficheiros que o cron regenera (ver pipeline/run_all.py) — o
  # resto de data/ (geojsons de fronteiras, adjacency.json) é estático,
  # fica só no master, nunca precisa de ir para a branch `data`.
  FILES: "data/tile_info_squadrats.json data/tile_info_squadratinhos.json data/stats.json data/squadrats.json data/trophies.json data/suggestions.json data/club.json data/club_regioes.json data/daily_gains.json data/scan_cache.json data/classification_fallbacks.json"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Carregar o estado mais recente da branch 'data'
        run: |
          # sobrepõe os ficheiros dinâmicos com a última versão publicada —
          # sem isto, cada corrida arrancava do snapshot congelado que ficou
          # no master no dia da migração, perdendo o scan_cache.json (a
          # cache de cobertura que faz a corrida custar ~2032 pedidos em vez
          # de ~6274, ver comentário do tiles_fetch.py) e o baseline do
          # daily_gains.json.
          git fetch origin data
          git checkout origin/data -- $FILES

      # Um passo só, de propósito: os três consumidores partilham o varrimento
      # (ver pipeline/run_all.py). Em passos separados, cada um varria os
      # mesmos UIDs outra vez.
      - name: Varrer e gerar tudo (mapa detalhado + totais do clube + club)
        env:
          # nomes → firebase UID dos atletas do clube; fora do código porque é
          # informação de terceiros (ver pipeline/athletes.py). Ordem do JSON =
          # ordem dos bits do bitmask, não mexer sem regenerar data/club.json.
          ATHLETES_JSON: ${{ secrets.ATHLETES_JSON }}
        run: python3 pipeline/run_all.py data

      - name: Publicar na branch 'data' só se houver diferença real
        run: |
          # diff contra o índice, não contra o HEAD do master: o passo
          # anterior ("carregar o estado mais recente") já deixou o índice a
          # apontar para o último estado publicado na branch `data` — isto
          # detecta corretamente "o pipeline não mudou nada desde a última
          # publicação", mesmo o master nunca mais sendo tocado depois disto.
          if git diff --quiet -- $FILES; then
            echo "sem alterações reais — nada a publicar."
            exit 0
          fi

          git config user.name "squadrats-bot"
          git config user.email "actions@users.noreply.github.com"

          # worktree à parte para a branch `data`, de propósito: NUNCA troca
          # de branch no checkout principal (que continua em master até ao
          # fim do job). Trocar de branch a meio, com estes ficheiros por
          # comitar, arriscava "local changes would be overwritten".
          git worktree add -B data /tmp/data-branch origin/data
          for f in $FILES; do
            mkdir -p "/tmp/data-branch/$(dirname "$f")"
            cp "$f" "/tmp/data-branch/$f"
          done

          cd /tmp/data-branch
          git config user.name "squadrats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(data): atualizar squares via vector tiles [skip ci]"
          git push origin data

      # GitHub desativa `schedule` em repos sem atividade há 60 dias — se isso
      # acontecer, o cron morre em silêncio e o mapa fica congelado. Este passo
      # mantém o master "vivo" sem depender de trabalho real: só commita
      # heartbeat.txt se o último commit ao master tiver mais de 25 dias.
      #
      # Herdado do renew-drive-watch.yml, removido em 2026-08-18 com o resto do
      # stack Drive/KML. Lá o passo tinha um bug latente: lia
      # `git log -1 -- heartbeat.txt` num checkout shallow (depth 1), onde o
      # commit de fronteira parece introduzir todos os ficheiros — devolvia a
      # data do último commit ao master, não a do último heartbeat (o log dizia
      # "há 1 dias" com o heartbeat.txt parado desde 19 Jul). Como o que
      # interessa é mesmo a atividade do repo, aqui pede-se isso directamente,
      # sem precisar do histórico do ficheiro (continua a dar certo em shallow).
      - name: Heartbeat (mantém o schedule do Actions ativo)
        if: always()
        # nunca deixar um problema do heartbeat marcar como falhada uma corrida
        # que publicou dados bem — isto é rede de segurança, não o trabalho.
        continue-on-error: true
        run: |
          git config user.name "squadrats-bot"
          git config user.email "actions@users.noreply.github.com"

          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$dias" -lt 25 ]; then
            echo "último commit ao master há $dias dias — schedule seguro, nada a fazer."
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          # --only heartbeat.txt de propósito: o passo "carregar o estado mais
          # recente" faz `git checkout origin/data -- $FILES`, que deixa esses
          # ficheiros de dados STAGED no índice do master. Um `git commit` sem
          # restrição de caminho arrastava-os para o master — exactamente o que
          # a migração para a branch `data` (2026-08-14) veio evitar.
          git commit --only heartbeat.txt -m "chore: heartbeat (mantém o schedule do Actions ativo) [skip ci]"
          git push origin HEAD:master
