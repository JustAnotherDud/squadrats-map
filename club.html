<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Squadrats — Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<!-- vocabulário partilhado com o index.html (países, bandeiras, níveis, grelha
     XYZ) — síncrono de propósito, o script inline abaixo usa-o logo -->
<script src="shared.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0f1115; color:#e7e9ee; overflow:hidden; }
  #map { position:absolute; inset:0; }

  #topbar { position:absolute; top:0; left:0; right:0; z-index:1000; padding:8px 10px; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  #topbar h1 { font-size:14px; margin:0; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  #topbar h1 a { pointer-events:auto; font-weight:400; font-size:12px; color:#7ab8ff; }
  .seg { display:flex; gap:4px; pointer-events:auto; flex-wrap:wrap; }
  .seg button { background:rgba(21,24,33,.92); color:#e7e9ee; border:1px solid #2c3242; border-radius:7px; padding:6px 9px; font-size:11.5px; cursor:pointer; backdrop-filter: blur(4px); display:flex; align-items:center; gap:5px; }
  .seg button.off { opacity:.45; }
  .seg button.on { background:#3d7bf5; border-color:#3d7bf5; color:#fff; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:2px; flex-shrink:0; }

  #painel { position:absolute; left:0; right:0; bottom:0; z-index:1000; background:#151821; border-top:1px solid #262b38; border-radius:14px 14px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.4); max-height:58vh; display:flex; flex-direction:column; }
  #painel-cabeca { padding:10px 14px; display:flex; justify-content:space-between; align-items:center; font-size:13px; cursor:pointer; user-select:none; }
  #painel-cabeca b { color:#fff; }
  #painel-corpo { padding:0 14px 16px; overflow-y:auto; display:none; }
  #painel.aberto #painel-corpo { display:block; }
  .linha-stat { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #1e2230; font-size:12.5px; }
  .linha-stat b { color:#fff; white-space:nowrap; }
  .esq { display:flex; align-items:center; gap:7px; overflow:hidden; }
  .esq span.txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .titulo-seccao { margin-top:12px; margin-bottom:2px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#7d8598; }
  .nota { font-size:10px; color:#6b7285; padding:8px 0 0; line-height:1.45; }
  .detalhe-toggle { display:flex; justify-content:space-between; align-items:baseline; cursor:pointer; user-select:none; }
  .detalhe-toggle .seta { color:#7ab8ff; text-transform:none; letter-spacing:0; font-size:11px; }
  .detalhe-toggle:active { opacity:.7; }
  .fraco { color:#7d8598; font-weight:400; font-size:11px; }
  /* Ecrãs largos (2026-08-19): o painel ocupa a largura toda e cada .linha-stat
     é um flex com space-between — num monitor de 1900px o número acabava a
     meio metro do nome a que pertence. Encolher o painel resolvia a distância
     mas desperdiçava o espaço todo; em vez disso o conteúdo flui por colunas,
     que aproxima o valor do nome E mostra mais linhas sem scroll.
     Os controlos (.seg) e as notas de rodapé atravessam as colunas todas —
     senão apareciam espremidos numa só.
     Largura de coluna fixa, não número fixo de colunas: com column-count:2 num
     ecrã de 1280 cada coluna ficava com 640px e o número continuava a 475px do
     nome. Com column-width o browser mete as colunas que couberem a ~330px, que
     é a largura a que "Rio Maior ... 1677 34.4%" se lê de uma assentada. */
  @media (min-width: 900px) {
    #painel-corpo { columns:260px; column-gap:26px; }
    #painel-corpo > .seg, #painel-corpo > .nota { column-span:all; }
    /* um grupo (região + os seus atletas, ou título + as suas linhas) nunca
       parte a meio de uma coluna */
    .grupo { break-inside:avoid; }
    /* nem um título fica órfão no fundo de uma coluna, longe das suas linhas */
    .titulo-seccao { break-after:avoid; }
    .linha-stat { break-inside:avoid; }
    /* o painel pode crescer mais: com colunas cabe muito mais no mesmo scroll */
    #painel { max-height:70vh; }
  }

  /* levantar o zoom acima do painel colapsado */
  .leaflet-bottom.leaflet-right { bottom:52px; }

  #hover { position:absolute; z-index:1001; top:auto; bottom:calc(100% + 8px); left:10px; right:10px; background:rgba(21,24,33,.96); border:1px solid #2c3242; border-radius:9px; padding:8px 11px; font-size:12px; display:none; backdrop-filter: blur(4px); pointer-events:none; }
  #hover.visivel { display:block; }
  #hover .quem { color:#fff; font-weight:600; }
  #hover .coord { color:#6b7285; font-size:10.5px; margin-top:2px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <h1>Squadrats — Club · <a href="atletas/">perfis dos atletas →</a></h1>
  <div class="seg" id="seg-atletas"></div>
</div>

<div id="painel">
  <div id="hover"><div class="quem"></div><div class="coord"></div></div>
  <div id="painel-cabeca"><span id="painel-resumo"></span><span style="color:#7d8598">▲</span></div>
  <div id="painel-corpo"></div>
</div>

<script>
// Página do club: só squadratinhos, só os três que têm conta Squadrats.
// Sem classificação por concelho nem troféus — o assunto aqui é quem
// partilha o quê. Deliberadamente sem link para o `index.html` (o mapa
// pessoal detalhado do dono): são dois sítios separados, e quem recebe este
// link não deve cair no outro.
// Liga sim para /atletas/<slug>.html — os perfis são info do clube (as mesmas
// contagens/ranking que este painel mostra, reunidas por atleta), não o mapa
// pessoal. O slug vem do club.json (pipeline/fetch_club_squares.py).

// Só o modo "quantos" (2026-08-15, tirei o "quem" — cor da pessoa nos
// exclusivos, escala neutra cinzento-a-branco nos partilhados, sem riscas).
// Com 5 pessoas há 26 combinações possíveis e não existem 26 cores
// distinguíveis, por isso a escala dos partilhados é deliberadamente neutra
// — o *quem* de cada square continua no tooltip (hover/click) e no Detalhe.
//
// Uma cor por atleta, na ordem de ATLETAS (pipeline/fetch_club_squares.py),
// que é quem fixa os bits. As cores em si vêm da fonte única
// data/membros_cores.json (partilhada com o club-koms) — carregada no arranque
// e remapeada por nome (ver mais abaixo). Esta lista é só o fallback offline,
// na mesma ordem de ATLETAS: Zé, Xeira, Carolina, Inês S., Pedro.
let COR_ATLETA = [
  '#e03131', // vermelho  (Zé)
  '#9c46d8', // roxo      (Xeira)
  '#c99a00', // dourado   (Carolina)
  '#e8710a', // laranja   (Inês S.)
  '#2f5fd0', // azul      (Pedro)
];

// bandeiras do shared.js (as mesmas do index.html) — aqui em 13x10, um pouco
// mais pequenas que no mapa pessoal. Estiveram copiadas à mão até 2026-08-18,
// e a cópia já tinha divergido uma vez.
const BANDEIRA = bandeiras(13, 10);

// Escala neutra do modo "quantos": não compete com nenhuma cor de pessoa
// (não tem matiz nenhuma) e clareia com o número de donos.
const ESCALA_PARTILHA = ['#7c8698', '#a9b3c4', '#d5dbe6', '#ffffff']; // 2,3,4,5+

function corPartilha(n) {
  return ESCALA_PARTILHA[Math.min(n - 2, ESCALA_PARTILHA.length - 1)];
}

let dados = null;
let dadosGeo = null;           // club_regioes.json — captured por atleta/região (2026-08-15)
let dadosStats = null;         // stats.json — totais partilhados (denominador), o mesmo p/ toda a gente
let porCoord = new Map();     // "x,y" -> mask
let activos = 0;              // bitmask dos atletas ligados
let camadaSquares = null;
let detalheAberto = false;
let geoAtletaSel = 0;          // índice do atleta seleccionado no "Por atleta"
let leaderboardSoDisputadas = true;  // só regiões com 2+ pessoas, por defeito
let leaderboardNivel = 'concelho';   // 'pais' | 'distrito' | 'concelho'

// três abas dentro do painel, em vez de tudo empilhado (2026-08-15, revisto
// no mesmo dia): "sobreposição" (quem tem o quê no mapa, o assunto original
// desta página), "por atleta" (onde é que cada um anda) e "leaderboard"
// (quem manda em cada região) são três perguntas diferentes — cada uma na
// sua aba, conteúdo completo ao clicar, sem mostrar/esconder extra por
// dentro (a aba já é o mostrar/esconder).
let painelTab = 'sobreposicao';

// zoom em baixo à direita: no canto superior esquerdo ficava por baixo do
// título. Em baixo também fica mais à mão no telemóvel.
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([39.5, -8.8], 9);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16,
  attribution: '&copy; <a href="https://www.esri.com">Esri</a>, HERE, Garmin, OpenStreetMap contributors',
}).addTo(map);

function nomes(mask) {
  return dados.atletas.filter((_, i) => mask & (1 << i)).map(a => a.nome);
}

function rotulo(mask) {
  const ns = nomes(mask);
  return ns.length === dados.atletas.length ? 'Todos' : ns.join(' + ');
}

// --- desenho ---
// Canvas por tile, não L.rectangle: são ~9000 squares e em SVG o mapa
// engasga a arrastar. Cada tile percorre a lista toda — a 9000 entradas o
// filtro é mais barato do que manter um índice espacial sincronizado.
const CamadaSquares = L.GridLayer.extend({
  createTile: function (coords) {
    const t = document.createElement('canvas');
    const lado = this.getTileSize().x;
    t.width = t.height = lado;
    if (!dados) return t;

    const ctx = t.getContext('2d');
    const escala = 256 * Math.pow(2, coords.z - dados.zoom); // px de um square
    const ox = coords.x * lado, oy = coords.y * lado;
    // abaixo de 1px o square desaparecia entre pixéis; forçar 1px mantém a
    // mancha legível quando se afasta a vista
    const desenho = Math.max(escala, 1);

    for (const [sx, sy, m] of dados.squares) {
      const em = m & activos;
      if (!em) continue;
      const px = sx * escala - ox, py = sy * escala - oy;
      if (px + escala < 0 || px > lado || py + escala < 0 || py > lado) continue;

      const n = contaBits(em);
      if (n === 1) {
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = COR_ATLETA[Math.log2(em)];
        ctx.fillRect(px, py, desenho, desenho);
      } else {
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = corPartilha(n);
        ctx.fillRect(px, py, desenho, desenho);
      }
    }
    return t;
  },
});

function contaBits(n) {
  let c = 0;
  while (n) { c += n & 1; n >>= 1; }
  return c;
}

function redesenhar() {
  if (camadaSquares) camadaSquares.redraw();
}

// --- interacção ---
function coordDoPonto(latlng) {
  return lonlatParaTile(latlng.lat, latlng.lng, dados.zoom); // shared.js
}

const hover = document.getElementById('hover');
function mostrarSquare(latlng) {
  if (!dados) return;
  const [x, y] = coordDoPonto(latlng);
  const m = porCoord.get(x + ',' + y);
  const em = m ? m & activos : 0;
  if (!em) { hover.classList.remove('visivel'); return; }
  const n = contaBits(em);
  // cada nome com a bolinha da sua cor — é o que as riscas do square dizem
  const quem = dados.atletas
    .map((a, i) => [a, i]).filter(([, i]) => em & (1 << i))
    .map(([a, i]) => `<span class="dot" style="background:${COR_ATLETA[i]}"></span>${a.nome}`)
    .join(' ');
  hover.querySelector('.quem').innerHTML =
    (n === 1 ? 'Só ' : `<b>${n} pessoas</b> · `) + quem;
  hover.querySelector('.coord').textContent =
    `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)} · square ${x}/${y}`;
  hover.classList.add('visivel');
}
map.on('mousemove', e => mostrarSquare(e.latlng));
map.on('click', e => mostrarSquare(e.latlng));
map.on('mouseout', () => hover.classList.remove('visivel'));

// --- controlos e painel ---
function renderAtletas() {
  const box = document.getElementById('seg-atletas');
  box.innerHTML = dados.atletas.map((a, i) => {
    const ligado = activos & (1 << i);
    return `<button data-i="${i}" class="${ligado ? '' : 'off'}">
      <span class="dot" style="background:${COR_ATLETA[i]}"></span>${a.nome}</button>`;
  }).join('');
  box.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      activos ^= (1 << Number(b.dataset.i));
      renderAtletas();
      renderPainel();
      redesenhar();
      hover.classList.remove('visivel');
    };
  });
}

function renderPainel() {
  const visiveis = dados.squares.reduce((n, s) => n + ((s[2] & activos) ? 1 : 0), 0);
  document.getElementById('painel-resumo').innerHTML =
    `<b>${visiveis.toLocaleString('pt-PT')}</b> squadratinhos visíveis`;

  // contar pelas máscaras efectivas (m & activos), não pelas do ficheiro:
  // com um atleta desligado, um square que era partilhado por dois passa a ser
  // só do outro no mapa, e a legenda tem de dizer o mesmo — senão explica
  // riscas que lá não estão e omite as que estão
  const efectivas = new Map();
  for (const s of dados.squares) {
    const em = s[2] & activos;
    if (em) efectivas.set(em, (efectivas.get(em) || 0) + 1);
  }
  // exclusivos ficam por pessoa (uma linha cada); partilhados agrupam-se pelo
  // número de pessoas, senão com 5 atletas eram 26 linhas. As combinações
  // concretas, com as riscas certas, ficam no Detalhe.
  const soDe = new Map();        // índice do atleta -> nº de squares só dele
  const partilhados = new Map(); // nº de pessoas -> nº de squares
  for (const [m, n] of efectivas) {
    const c = contaBits(m);
    if (c === 1) soDe.set(Math.log2(m), n);
    else partilhados.set(c, (partilhados.get(c) || 0) + n);
  }

  const linhas = [];
  linhas.push(`<div class="seg" style="margin-bottom:10px">
    <button data-painel-tab="sobreposicao" class="${painelTab === 'sobreposicao' ? 'on' : ''}">Sobreposição</button>
    <button data-painel-tab="atleta" class="${painelTab === 'atleta' ? 'on' : ''}">Por atleta</button>
    <button data-painel-tab="leaderboard" class="${painelTab === 'leaderboard' ? 'on' : ''}">Leaderboard</button>
  </div>`);

  if (painelTab === 'sobreposicao') {
    // cada secção num .grupo: em ecrã largo o painel flui por colunas e um
    // título não se pode separar das linhas que encabeça (ver CSS)
    const porAtleta = dados.atletas.map((a, i) => {
      const ligado = activos & (1 << i);
      return `<div class="linha-stat" style="${ligado ? '' : 'opacity:.4'}">
        <span class="esq"><span class="dot" style="background:${COR_ATLETA[i]}"></span>
        <span class="txt">${a.nome}</span></span>
        <b>${a.total.toLocaleString('pt-PT')}</b></div>`;
    }).join('');
    linhas.push(`<div class="grupo"><div class="titulo-seccao">Por atleta</div>${porAtleta}</div>`);

    const soLinhas = dados.atletas.map((a, i) => {
      if (!soDe.has(i)) return '';
      return `<div class="linha-stat">
        <span class="esq"><span class="dot" style="background:${COR_ATLETA[i]}"></span>
        <span class="txt">Só ${a.nome}</span></span>
        <b>${soDe.get(i).toLocaleString('pt-PT')}</b></div>`;
    }).join('');
    const partLinhas = [...partilhados.keys()].sort((a, b) => a - b).map(c => `
      <div class="linha-stat">
        <span class="esq"><span class="dot" style="background:${corPartilha(c)}"></span>
        <span class="txt">${c} pessoas</span></span>
        <b>${partilhados.get(c).toLocaleString('pt-PT')}</b></div>`).join('');
    linhas.push(`<div class="grupo"><div class="titulo-seccao">No mapa</div>${soLinhas}${partLinhas}</div>`);

    // Quem partilha com quem vive aqui, com as riscas certas de cada combinação —
    // escondido por defeito para o painel não ficar uma parede de números.
    linhas.push(`<div class="titulo-seccao detalhe-toggle" id="sobreposicao-detalhe-toggle">Detalhe
      <span class="seta">${detalheAberto ? 'esconder' : 'mostrar'}</span></div>`);
    if (detalheAberto) {
      dados.atletas.forEach((a, i) => {
        if (!(activos & (1 << i))) return;
        const so = soDe.get(i) || 0;
        const pct = a.total ? Math.round(100 * so / a.total) : 0;
        linhas.push(`<div class="linha-stat">
          <span class="esq"><span class="dot" style="background:${COR_ATLETA[i]}"></span>
          <span class="txt">${a.nome} — único</span></span>
          <b>${so.toLocaleString('pt-PT')} <span class="fraco">${pct}%</span></b></div>`);
      });

      const pares = [...efectivas.keys()].filter(m => contaBits(m) > 1)
        .sort((a, b) => contaBits(a) - contaBits(b) || efectivas.get(b) - efectivas.get(a));
      pares.forEach(m => {
        linhas.push(`<div class="linha-stat">
          <span class="esq"><span class="dot" style="background:${corPartilha(contaBits(m))}"></span>
          <span class="txt">${rotulo(m)}</span></span>
          <b>${efectivas.get(m).toLocaleString('pt-PT')}</b></div>`);
      });
    }

    linhas.push(`<div class="nota">Squadratinhos (zoom 17, ~201 m de lado).
      Cada pessoa tem a sua cor nos exclusivos; os partilhados seguem uma escala
      cinzenta que clareia com o número de donos (quem exactamente, no hover/click
      de cada square, ou aqui em baixo em Detalhe).
      Os totais por atleta são sempre os reais; as linhas de baixo contam o que
      está no mapa neste momento, por isso mudam quando se desliga alguém.<br>
      Actualizado: ${dados.atualizado.replace('T', ' ').replace('Z', ' UTC')}</div>`);
  } else if (painelTab === 'atleta') {
    linhas.push(renderDetalheGeo());
  } else {
    linhas.push(renderLeaderboard());
  }

  const corpo = document.getElementById('painel-corpo');
  corpo.innerHTML = linhas.join('');
  corpo.querySelectorAll('[data-painel-tab]').forEach(b => {
    b.onclick = () => { painelTab = b.dataset.painelTab; renderPainel(); };
  });
  const detalheToggle = document.getElementById('sobreposicao-detalhe-toggle');
  if (detalheToggle) detalheToggle.onclick = () => {
    detalheAberto = !detalheAberto;
    renderPainel();
  };
  corpo.querySelectorAll('[data-geo-atleta]').forEach(b => {
    b.onclick = () => { geoAtletaSel = Number(b.dataset.geoAtleta); renderPainel(); };
  });
  const lbFiltro = document.getElementById('leaderboard-filtro');
  if (lbFiltro) lbFiltro.onclick = () => { leaderboardSoDisputadas = !leaderboardSoDisputadas; renderPainel(); };
  corpo.querySelectorAll('[data-leaderboard-nivel]').forEach(b => {
    b.onclick = () => { leaderboardNivel = b.dataset.leaderboardNivel; renderPainel(); };
  });
}

// --- detalhe geográfico por atleta (2026-08-15) ---
// club_regioes.json só tem "captured" por região (ver classify_club.py); o
// total/denominador é sempre o mesmo para toda a gente, já publicado em
// stats.json (by_distrito/by_concelho/by_region_XX/by_municipio_XX) — aqui
// só se combinam os dois, sem duplicar a lógica de classificação.
function totalDe(bucket, nome) {
  const s = dadosStats && dadosStats[bucket] && dadosStats[bucket][nome];
  return s && s.z17 ? s.z17.total : null;
}

const NOME_PAIS = PAIS_NOME; // shared.js

// País — geo.country já vem pronto do classify_club.py, só falta
// juntar o total partilhado (stats.json) para a percentagem (2026-08-15).
function linhasPais(country) {
  return Object.entries(country || {}).map(([cc, captured]) => {
    const s = dadosStats && dadosStats[`country_${cc.toLowerCase()}`];
    const total = s && s.z17 ? s.z17.total : null;
    return { cc, nome: NOME_PAIS[cc] || cc, captured, total };
  }).sort((a, b) => b.captured - a.captured);
}

// PT e estrangeiro usam palavras diferentes em stats.json, não só um sufixo
// de país (by_distrito vs by_region_es, by_concelho vs by_municipio_es) —
// por isso dois nomes de bucket em vez de um prefixo só.
function linhasGeo(porPaisCaptured, ptBucket, foreignBucketBase) {
  // porPaisCaptured: { 'pt': {nome: n}, 'es': {...}, ... } — 'pt' é especial
  // (sem prefixo de bandeira nas chaves de stats.json, ver pipeline.py)
  const linhas = [];
  for (const [cc, porNome] of Object.entries(porPaisCaptured)) {
    const bucket = cc === 'pt' ? ptBucket : `${foreignBucketBase}_${cc}`;
    for (const [nome, captured] of Object.entries(porNome)) {
      const total = totalDe(bucket, nome);
      linhas.push({ cc: cc.toUpperCase(), nome, captured, total });
    }
  }
  return linhas.sort((a, b) => b.captured - a.captured);
}

function tabelaGeo(titulo, linhas) {
  if (!linhas.length) return '';
  const corpo = linhas.map(r => {
    const pct = r.total ? ` <span class="fraco">${(100 * r.captured / r.total).toFixed(1)}%</span>` : '';
    return `<div class="linha-stat">
      <span class="esq"><span class="txt">${BANDEIRA[r.cc] || ''} ${r.nome}</span></span>
      <b>${r.captured.toLocaleString('pt-PT')}${pct}</b></div>`;
  }).join('');
  return `<div class="grupo"><div class="titulo-seccao">${titulo}</div>${corpo}</div>`;
}

function renderDetalheGeo() {
  const linhas = [];
  if (!dadosGeo) {
    linhas.push('<div class="nota">club_regioes.json ainda não disponível.</div>');
    return linhas.join('');
  }

  linhas.push('<div class="seg" style="margin:4px 0 8px">' + dados.atletas.map((a, i) => `
    <button data-geo-atleta="${i}" class="${i === geoAtletaSel ? 'on' : ''}" style="${i === geoAtletaSel ? `border-color:${COR_ATLETA[i]};background:${COR_ATLETA[i]}22` : ''}">
      <span class="dot" style="background:${COR_ATLETA[i]}"></span>${a.nome}
    </button>`).join('') + '</div>');

  const atletaSel = dados.atletas[geoAtletaSel];
  const nomeSel = atletaSel.nome;
  const hrefPerfil = atletaSel.slug ? `atletas/${atletaSel.slug}.html` : 'atletas/';
  linhas.push(`<div class="detalhe-toggle" style="margin:0 0 8px">
    <a href="${hrefPerfil}" class="seta">ver perfil completo de ${nomeSel} →</a></div>`);

  const geo = dadosGeo.atletas[nomeSel];
  if (!geo) {
    linhas.push(`<div class="nota">Sem dados geográficos para ${nomeSel}.</div>`);
    return linhas.join('');
  }

  linhas.push(tabelaGeo('País', linhasPais(geo.country)));
  const porDistrito = { pt: geo.by_distrito, ...geo.by_region };
  const porConcelho = { pt: geo.by_concelho, ...geo.by_municipio };
  linhas.push(tabelaGeo('Região', linhasGeo(porDistrito, 'by_distrito', 'by_region')));
  linhas.push(tabelaGeo('Zona', linhasGeo(porConcelho, 'by_concelho', 'by_municipio')));

  linhas.push(`<div class="nota">Squadratinhos (zoom 17). Totais partilhados com o mapa pessoal
    (mesma grelha para toda a gente) — só a contagem capturada muda por atleta.
    ${dadosGeo.atualizado ? `Actualizado: ${dadosGeo.atualizado.replace('T', ' ').replace('Z', ' UTC')}` : ''}</div>`);

  return linhas.join('');
}

// --- leaderboard por região (2026-08-15) — "quem manda em X" ---
// Não precisa de dados novos: club_regioes.json já tem tudo, isto é só o
// mesmo club_regioes.json pivotado (por atleta -> por região) em vez de
// (por região -> por atleta), inteiramente no browser.
// nivel: 'pais' | 'distrito' | 'concelho'. Cada um usa um par de buckets
// diferente (país é um caso à parte — geo.country já vem plano, sem nome
// separado do código do país).
function pivotRegioes(nivel) {
  const porRegiao = new Map();
  if (!dadosGeo) return porRegiao;
  dados.atletas.forEach((a, i) => {
    const geo = dadosGeo.atletas[a.nome];
    if (!geo) return;
    if (nivel === 'pais') {
      for (const [cc, captured] of Object.entries(geo.country || {})) {
        if (!porRegiao.has(cc)) porRegiao.set(cc, { cc, nome: NOME_PAIS[cc] || cc, entradas: [] });
        porRegiao.get(cc).entradas.push({ i, atleta: a.nome, captured });
      }
      return;
    }
    const porPais = nivel === 'distrito'
      ? { pt: geo.by_distrito, ...geo.by_region }
      : { pt: geo.by_concelho, ...geo.by_municipio };
    for (const [cc, porNome] of Object.entries(porPais)) {
      for (const [nome, captured] of Object.entries(porNome)) {
        const chave = `${cc}|${nome}`;
        if (!porRegiao.has(chave)) porRegiao.set(chave, { cc: cc.toUpperCase(), nome, entradas: [] });
        porRegiao.get(chave).entradas.push({ i, atleta: a.nome, captured });
      }
    }
  });
  return porRegiao;
}

function bucketDe(nivel, cc) {
  if (nivel === 'pais') return `country_${cc.toLowerCase()}`;
  if (nivel === 'distrito') return cc === 'PT' ? 'by_distrito' : `by_region_${cc.toLowerCase()}`;
  return cc === 'PT' ? 'by_concelho' : `by_municipio_${cc.toLowerCase()}`;
}

// chaves internas antigas (distrito/concelho), rótulos do shared.js
const LEADERBOARD_NIVEIS = { pais: NIVEL_LABEL.pais, distrito: NIVEL_LABEL.regiao, concelho: NIVEL_LABEL.zona };

function renderLeaderboard() {
  const linhas = [];
  if (!dadosGeo) {
    linhas.push('<div class="nota">club_regioes.json ainda não disponível.</div>');
    return linhas.join('');
  }

  linhas.push('<div class="seg" style="margin:4px 0 8px">' + Object.entries(LEADERBOARD_NIVEIS).map(([k, label]) => `
    <button data-leaderboard-nivel="${k}" class="${leaderboardNivel === k ? 'on' : ''}">${label}</button>`).join('') + '</div>');
  linhas.push(`<div class="seg" style="margin:0 0 8px">
    <button id="leaderboard-filtro" class="${leaderboardSoDisputadas ? 'on' : ''}">Só disputadas (2+ pessoas)</button>
  </div>`);

  let entradas = [...pivotRegioes(leaderboardNivel).values()];
  if (leaderboardSoDisputadas) entradas = entradas.filter(r => r.entradas.length >= 2);
  entradas.forEach(r => {
    r.entradas.sort((a, b) => b.captured - a.captured);
    r.melhor = r.entradas[0].captured;
  });
  // mais disputada primeiro (mais pessoas), empate desempata pelo líder com
  // mais squares — as duas coisas que tornam uma região "interessante" aqui
  entradas.sort((a, b) => b.entradas.length - a.entradas.length || b.melhor - a.melhor);

  if (!entradas.length) {
    linhas.push('<div class="nota">Nenhuma região disputada por 2+ pessoas ainda.</div>');
  }

  entradas.forEach(r => {
    // país é plano em stats.json (country_pt.z17.total, sem nome dentro),
    // ao contrário dos outros buckets (nome -> zoom -> total) — totalDe()
    // não serve aqui, ver linhasPais() que tem o mesmo caso.
    const total = leaderboardNivel === 'pais'
      ? (dadosStats && dadosStats[bucketDe('pais', r.cc)] && dadosStats[bucketDe('pais', r.cc)].z17
          ? dadosStats[bucketDe('pais', r.cc)].z17.total : null)
      : totalDe(bucketDe(leaderboardNivel, r.cc), r.nome);
    const linhasAtletas = r.entradas.map((e, pos) => {
      const pct = total ? ` <span class="fraco">${(100 * e.captured / total).toFixed(1)}%</span>` : '';
      const slug = dados.atletas[e.i] && dados.atletas[e.i].slug;
      const nome = slug ? `<a href="atletas/${slug}.html" style="color:inherit">${e.atleta}</a>` : e.atleta;
      return `<div class="linha-stat" style="padding-left:16px">
        <span class="esq"><span class="txt">${pos + 1}º</span>
        <span class="dot" style="background:${COR_ATLETA[e.i]}"></span>
        <span class="txt">${nome}</span></span>
        <b>${e.captured.toLocaleString('pt-PT')}${pct}</b></div>`;
    }).join('');
    linhas.push(`<div class="grupo"><div class="linha-stat" style="font-weight:600">
      <span class="esq"><span class="txt">${BANDEIRA[r.cc] || ''} ${r.nome}</span></span>
      <b class="fraco">${r.entradas.length} pessoas</b></div>${linhasAtletas}</div>`);
  });

  linhas.push(`<div class="nota">Ranking por squares capturados (não por %) dentro de cada região.
    "Disputada" = 2 ou mais pessoas com pelo menos 1 square lá.</div>`);

  return linhas.join('');
}

const painel = document.getElementById('painel');
document.getElementById('painel-cabeca').onclick = () => painel.classList.toggle('aberto');

(async function () {
  // no-cache = revalidar sempre com o servidor (304 quando não mudou, por isso
  // não custa tráfego). Sem isto o browser servia o JSON de ontem depois de um
  // run do pipeline e a página parecia parada.
  // club.json vive na branch `data`, não no master (2026-08-14) — ver
  // fetch-map-data.yml.
  const r = await fetch('https://raw.githubusercontent.com/JustAnotherDud/squadrats-map/data/data/club.json', { cache: 'no-cache' });
  if (!r.ok) {
    document.getElementById('painel-resumo').textContent = 'club.json não encontrado';
    return;
  }
  dados = await r.json();
  dados.squares.forEach(([x, y, m]) => porCoord.set(x + ',' + y, m));
  activos = (1 << dados.atletas.length) - 1;

  // Cores dos membros: fonte única em data/membros_cores.json (branch main,
  // partilhada com o club-koms). Remapeia COR_ATLETA por nome; se a fetch
  // falhar ou faltar um nome, fica o fallback offline definido em cima.
  try {
    const rc = await fetch('https://raw.githubusercontent.com/JustAnotherDud/squadrats-map/main/data/membros_cores.json', { cache: 'no-cache' });
    if (rc.ok) {
      const { cores } = await rc.json();
      COR_ATLETA = dados.atletas.map((a, i) => cores[a.nome] || COR_ATLETA[i]);
    }
  } catch (e) {
    console.warn('membros_cores.json indisponível, a usar fallback:', e);
  }

  camadaSquares = new CamadaSquares().addTo(map);
  renderAtletas();
  renderPainel();

  // detalhe geográfico: opcional, carregado à parte e sem bloquear o resto —
  // club_regioes.json é mais recente que club.json (2026-08-15) e pode ainda
  // não existir num deploy fresco antes do primeiro run do cron
  const BRANCH = 'https://raw.githubusercontent.com/JustAnotherDud/squadrats-map/data/data/';
  try {
    const [rg, rs] = await Promise.all([
      fetch(BRANCH + 'club_regioes.json', { cache: 'no-cache' }),
      fetch(BRANCH + 'stats.json', { cache: 'no-cache' }),
    ]);
    if (rg.ok) dadosGeo = await rg.json();
    if (rs.ok) dadosStats = await rs.json();
  } catch (e) {
    console.warn('detalhe geográfico indisponível:', e);
  }
  renderPainel();
})();
</script>
