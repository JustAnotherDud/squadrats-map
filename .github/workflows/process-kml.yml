name: process-kml

# FALLBACK — o caminho principal passou a ser fetch-map-data.yml (vector
# tiles, sem export manual). Isto fica desativado na prática assim que
# ninguém mais largar KMLs na pasta do Drive, mas não foi removido: se o
# endpoint de vector tiles mudar/for bloqueado sem aviso (não documentado,
# ver README), isto continua pronto a usar sem reconstruir nada.
#
# Só repository_dispatch — de propósito, sem trigger de push. O próprio job
# faz commit no fim; se reagisse a push também, o commit do bot disparava-se
# a si próprio (não é loop infinito, o segundo run não tem payload de dispatch
# e sai sem fazer nada, mas é ruído/confusão a evitar).
on:
  repository_dispatch:
    types: [kml-updated]

# Ficheiros duplicados do Drive (ex: "nome (1).kml") ou dois exports próximos
# no tempo disparam dois webhooks quase simultâneos -> dois runs em paralelo,
# ambos tentam git push, o segundo é rejeitado (non-fast-forward) e o job
# falha (visto em produção 21 jul). Com group fixo, runs concorrentes ficam
# em fila em vez de correr ao mesmo tempo — o segundo só arranca depois do
# primeiro terminar (checkout já traz o commit dele), por isso o "git diff
# --quiet" do passo de commit trata-o como no-op se não houver nada de novo.
concurrency:
  group: squadrats-data-push
  cancel-in-progress: false

jobs:
  process-kml:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Descarregar o KML (fileId do dispatch)
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          python3 pipeline/download_kml.py \
            "${{ github.event.client_payload.fileId }}" \
            /tmp/incoming.kml

      - name: Carregar o estado mais recente da branch 'data'
        run: |
          # mesma razão do fetch-map-data.yml: os dados vivem na branch
          # `data`, não no master (2026-08-14) — sem isto, o pipeline.py
          # arrancava do snapshot congelado do dia da migração.
          git fetch origin data
          git checkout origin/data -- data/tile_info_squadrats.json data/tile_info_squadratinhos.json data/stats.json

      - name: Correr o pipeline
        run: python3 pipeline/pipeline.py --kml /tmp/incoming.kml data

      - name: Publicar na branch 'data' só se houver diferença real
        run: |
          FILES="data/tile_info_squadrats.json data/tile_info_squadratinhos.json data/stats.json"

          # diff contra o índice (deixado pelo passo "carregar o estado mais
          # recente" a apontar para o último publicado), não contra o HEAD do
          # master — ver fetch-map-data.yml para a explicação completa.
          if git diff --quiet -- $FILES; then
            echo "sem alterações reais nos squares — nada a publicar."
            exit 0
          fi

          git config user.name "squadrats-bot"
          git config user.email "actions@users.noreply.github.com"

          # worktree à parte, nunca troca de branch no checkout principal —
          # mesma razão do fetch-map-data.yml.
          git worktree add -B data /tmp/data-branch origin/data
          for f in $FILES; do
            mkdir -p "/tmp/data-branch/$(dirname "$f")"
            cp "$f" "/tmp/data-branch/$f"
          done

          cd /tmp/data-branch
          git config user.name "squadrats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(data): atualizar squares (${{ github.event.client_payload.fileName }}) [skip ci]"

          # cinto e suspensórios: com o concurrency acima isto quase nunca
          # dispara, mas cobre a janela rara entre runs concorrentes que
          # escapem à fila. Se o push falhar por conflito real, deixa o job
          # falhar visivelmente em vez de forçar — mais fácil de investigar
          # do que silenciar.
          git push origin data
