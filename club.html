<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Squadrats — Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0f1115; color:#e7e9ee; overflow:hidden; }
  #map { position:absolute; inset:0; }

  #topbar { position:absolute; top:0; left:0; right:0; z-index:1000; padding:8px 10px; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  #topbar h1 { font-size:14px; margin:0; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  .seg { display:flex; gap:4px; pointer-events:auto; flex-wrap:wrap; }
  .seg button { background:rgba(21,24,33,.92); color:#e7e9ee; border:1px solid #2c3242; border-radius:7px; padding:6px 9px; font-size:11.5px; cursor:pointer; backdrop-filter: blur(4px); display:flex; align-items:center; gap:5px; }
  .seg button.off { opacity:.45; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:2px; flex-shrink:0; }

  #painel { position:absolute; left:0; right:0; bottom:0; z-index:1000; background:#151821; border-top:1px solid #262b38; border-radius:14px 14px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.4); max-height:58vh; display:flex; flex-direction:column; }
  #painel-cabeca { padding:10px 14px; display:flex; justify-content:space-between; align-items:center; font-size:13px; cursor:pointer; user-select:none; }
  #painel-cabeca b { color:#fff; }
  #painel-corpo { padding:0 14px 16px; overflow-y:auto; display:none; }
  #painel.aberto #painel-corpo { display:block; }
  .linha-stat { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #1e2230; font-size:12.5px; }
  .linha-stat b { color:#fff; white-space:nowrap; }
  .esq { display:flex; align-items:center; gap:7px; overflow:hidden; }
  .esq span.txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .titulo-seccao { margin-top:12px; margin-bottom:2px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#7d8598; }
  .nota { font-size:10px; color:#6b7285; padding:8px 0 0; line-height:1.45; }
  .detalhe-toggle { display:flex; justify-content:space-between; align-items:baseline; cursor:pointer; user-select:none; }
  .detalhe-toggle .seta { color:#7ab8ff; text-transform:none; letter-spacing:0; font-size:11px; }
  .detalhe-toggle:active { opacity:.7; }
  .fraco { color:#7d8598; font-weight:400; font-size:11px; }
  /* levantar o zoom acima do painel colapsado */
  .leaflet-bottom.leaflet-right { bottom:52px; }

  #hover { position:absolute; z-index:1001; top:auto; bottom:calc(100% + 8px); left:10px; right:10px; background:rgba(21,24,33,.96); border:1px solid #2c3242; border-radius:9px; padding:8px 11px; font-size:12px; display:none; backdrop-filter: blur(4px); pointer-events:none; }
  #hover.visivel { display:block; }
  #hover .quem { color:#fff; font-weight:600; }
  #hover .coord { color:#6b7285; font-size:10.5px; margin-top:2px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <h1>Squadrats — Club</h1>
  <div class="seg" id="seg-atletas"></div>
</div>

<div id="painel">
  <div id="hover"><div class="quem"></div><div class="coord"></div></div>
  <div id="painel-cabeca"><span id="painel-resumo"></span><span style="color:#7d8598">▲</span></div>
  <div id="painel-corpo"></div>
</div>

<script>
// Página do club: só squadratinhos, só os três que têm conta Squadrats.
// Sem classificação por concelho nem troféus — o assunto aqui é quem
// partilha o quê. Deliberadamente sem link para o mapa pessoal do José: são
// dois sítios separados, e quem recebe este link não deve cair no outro.

// Cor de cada pessoa, para os squares que só ela tem. Tons quentes, para não
// colidirem com a escala de partilha (fria). A ordem tem de acompanhar a lista
// ATLETAS do pipeline/fetch_club_squares.py, que é quem fixa os bits.
//
// O rosa da Inês fica a 30° do vermelho do Zé, que não é muito — mas verde era
// pior: com quatro pessoas a escala de partilha passa a usar o menta do "4
// pessoas", e um verde saturado ao lado dele confundia-se. Entre os dois
// riscos, o rosa é o menor.
const COR_ATLETA = [
  '#ef4444', // Zé
  '#a855f7', // Xeira
  '#facc15', // Carolina
  '#ec4899', // Inês — rosa
  '#f97316', // reserva
];

// Escala de partilha: a cor diz **quantas pessoas** têm o square, não quais.
// Uma cor por combinação não escalava — três pessoas dão 7 combinações, quatro
// dão 15, cinco dão 31, e não há 15 cores que se distingam num mapa escuro em
// squares de poucos pixéis. Quem partilha o quê fica no tooltip e nos toggles.
// A rampa clareia com o número de pessoas, para se ler como escala.
const COR_PARTILHA = ['#3b82f6', '#22d3ee', '#a7f3d0', '#ffffff']; // 2, 3, 4, 5+

function corDe(mask) {
  const n = contaBits(mask);
  if (n === 1) return COR_ATLETA[Math.log2(mask)];
  return COR_PARTILHA[Math.min(n - 2, COR_PARTILHA.length - 1)];
}

let dados = null;
let porCoord = new Map();     // "x,y" -> mask
let activos = 0;              // bitmask dos atletas ligados
let camadaSquares = null;
let detalheAberto = false;

// zoom em baixo à direita: no canto superior esquerdo ficava por baixo do
// título. Em baixo também fica mais à mão no telemóvel.
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([39.5, -8.8], 9);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);

function nomes(mask) {
  return dados.atletas.filter((_, i) => mask & (1 << i)).map(a => a.nome);
}

function rotulo(mask) {
  const ns = nomes(mask);
  return ns.length === dados.atletas.length ? 'Todos' : ns.join(' + ');
}

// --- desenho ---
// Canvas por tile, não L.rectangle: são ~9000 squares e em SVG o mapa
// engasga a arrastar. Cada tile percorre a lista toda — a 9000 entradas o
// filtro é mais barato do que manter um índice espacial sincronizado.
const CamadaSquares = L.GridLayer.extend({
  createTile: function (coords) {
    const t = document.createElement('canvas');
    const lado = this.getTileSize().x;
    t.width = t.height = lado;
    if (!dados) return t;

    const ctx = t.getContext('2d');
    const escala = 256 * Math.pow(2, coords.z - dados.zoom); // px de um square
    const ox = coords.x * lado, oy = coords.y * lado;
    // abaixo de 1px o square desaparecia entre pixéis; forçar 1px mantém a
    // mancha legível quando se afasta a vista
    const desenho = Math.max(escala, 1);

    for (const [sx, sy, m] of dados.squares) {
      const em = m & activos;
      if (!em) continue;
      const px = sx * escala - ox, py = sy * escala - oy;
      if (px + escala < 0 || px > lado || py + escala < 0 || py > lado) continue;
      ctx.fillStyle = corDe(em);
      // mais gente = mais opaco, a reforçar a rampa de cor
      ctx.globalAlpha = contaBits(em) > 1 ? 0.85 : 0.6;
      ctx.fillRect(px, py, desenho, desenho);
    }
    return t;
  },
});

function contaBits(n) {
  let c = 0;
  while (n) { c += n & 1; n >>= 1; }
  return c;
}

function redesenhar() {
  if (camadaSquares) camadaSquares.redraw();
}

// --- interacção ---
function coordDoPonto(latlng) {
  const n = Math.pow(2, dados.zoom);
  const rad = latlng.lat * Math.PI / 180;
  return [
    Math.floor((latlng.lng + 180) / 360 * n),
    Math.floor((1 - Math.asinh(Math.tan(rad)) / Math.PI) / 2 * n),
  ];
}

const hover = document.getElementById('hover');
function mostrarSquare(latlng) {
  if (!dados) return;
  const [x, y] = coordDoPonto(latlng);
  const m = porCoord.get(x + ',' + y);
  const em = m ? m & activos : 0;
  if (!em) { hover.classList.remove('visivel'); return; }
  const n = contaBits(em);
  hover.querySelector('.quem').innerHTML =
    `<span class="dot" style="background:${corDe(em)}"></span> ` +
    (n === 1 ? `Só ${rotulo(em)}` : `${n} pessoas · ${nomes(em).join(', ')}`);
  hover.querySelector('.coord').textContent =
    `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)} · square ${x}/${y}`;
  hover.classList.add('visivel');
}
map.on('mousemove', e => mostrarSquare(e.latlng));
map.on('click', e => mostrarSquare(e.latlng));
map.on('mouseout', () => hover.classList.remove('visivel'));

// --- controlos e painel ---
function renderAtletas() {
  const box = document.getElementById('seg-atletas');
  box.innerHTML = dados.atletas.map((a, i) => {
    const ligado = activos & (1 << i);
    return `<button data-i="${i}" class="${ligado ? '' : 'off'}">
      <span class="dot" style="background:${COR_ATLETA[i]}"></span>${a.nome}</button>`;
  }).join('');
  box.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      activos ^= (1 << Number(b.dataset.i));
      renderAtletas();
      renderPainel();
      redesenhar();
      hover.classList.remove('visivel');
    };
  });
}

function renderPainel() {
  const visiveis = dados.squares.reduce((n, s) => n + ((s[2] & activos) ? 1 : 0), 0);
  document.getElementById('painel-resumo').innerHTML =
    `<b>${visiveis.toLocaleString('pt-PT')}</b> squadratinhos visíveis`;

  // contar pelas máscaras efectivas (m & activos), não pelas do ficheiro:
  // com a Xeira desligada, um square Xeira+Carolina aparece no mapa com a cor
  // da Carolina, e a legenda tem de dizer o mesmo — senão explica cores que
  // lá não estão e omite as que estão
  const efectivas = new Map();
  for (const s of dados.squares) {
    const em = s[2] & activos;
    if (em) efectivas.set(em, (efectivas.get(em) || 0) + 1);
  }
  // exclusivos ficam por pessoa (uma linha cada); partilhados juntam-se pelo
  // número de pessoas, que é o que a cor no mapa passou a dizer
  const soDe = new Map();     // índice do atleta -> nº de squares só dele
  const partilhados = new Map(); // nº de pessoas -> nº de squares
  for (const [m, n] of efectivas) {
    const c = contaBits(m);
    if (c === 1) soDe.set(Math.log2(m), n);
    else partilhados.set(c, (partilhados.get(c) || 0) + n);
  }

  const linhas = [];
  linhas.push('<div class="titulo-seccao">Por atleta</div>');
  dados.atletas.forEach((a, i) => {
    const ligado = activos & (1 << i);
    linhas.push(`<div class="linha-stat" style="${ligado ? '' : 'opacity:.4'}">
      <span class="esq"><span class="dot" style="background:${COR_ATLETA[i]}"></span>
      <span class="txt">${a.nome}</span></span>
      <b>${a.total.toLocaleString('pt-PT')}</b></div>`);
  });

  linhas.push('<div class="titulo-seccao">No mapa</div>');
  dados.atletas.forEach((a, i) => {
    if (!soDe.has(i)) return;
    linhas.push(`<div class="linha-stat">
      <span class="esq"><span class="dot" style="background:${COR_ATLETA[i]}"></span>
      <span class="txt">Só ${a.nome}</span></span>
      <b>${soDe.get(i).toLocaleString('pt-PT')}</b></div>`);
  });
  [...partilhados.keys()].sort((a, b) => a - b).forEach(c => {
    linhas.push(`<div class="linha-stat">
      <span class="esq"><span class="dot" style="background:${corDe((1 << c) - 1)}"></span>
      <span class="txt">${c} pessoas</span></span>
      <b>${partilhados.get(c).toLocaleString('pt-PT')}</b></div>`);
  });

  // A cor já não diz *quem* partilha, só quantos. Esse detalhe passou a viver
  // aqui — escondido por defeito para o painel não ficar uma parede de números.
  linhas.push(`<div class="titulo-seccao detalhe-toggle">Detalhe
    <span class="seta">${detalheAberto ? 'esconder' : 'mostrar'}</span></div>`);
  if (detalheAberto) {
    dados.atletas.forEach((a, i) => {
      if (!(activos & (1 << i))) return;
      const so = soDe.get(i) || 0;
      const pct = a.total ? Math.round(100 * so / a.total) : 0;
      linhas.push(`<div class="linha-stat">
        <span class="esq"><span class="dot" style="background:${COR_ATLETA[i]}"></span>
        <span class="txt">${a.nome} — único</span></span>
        <b>${so.toLocaleString('pt-PT')} <span class="fraco">${pct}%</span></b></div>`);
    });

    const pares = [...efectivas.keys()].filter(m => contaBits(m) > 1)
      .sort((a, b) => contaBits(a) - contaBits(b) || efectivas.get(b) - efectivas.get(a));
    pares.forEach(m => {
      linhas.push(`<div class="linha-stat">
        <span class="esq"><span class="dot" style="background:${corDe(m)}"></span>
        <span class="txt">${rotulo(m)}</span></span>
        <b>${efectivas.get(m).toLocaleString('pt-PT')}</b></div>`);
    });
  }

  linhas.push(`<div class="nota">Squadratinhos (zoom 17, ~201 m de lado).
    A cor diz quantas pessoas têm o square; quem são está no tooltip e no detalhe.
    Os totais por atleta são sempre os reais; as linhas de baixo contam o que
    está no mapa neste momento, por isso mudam quando se desliga alguém.<br>
    Actualizado: ${dados.atualizado.replace('T', ' ').replace('Z', ' UTC')}</div>`);

  const corpo = document.getElementById('painel-corpo');
  corpo.innerHTML = linhas.join('');
  corpo.querySelector('.detalhe-toggle').onclick = () => {
    detalheAberto = !detalheAberto;
    renderPainel();
  };
}

const painel = document.getElementById('painel');
document.getElementById('painel-cabeca').onclick = () => painel.classList.toggle('aberto');

(async function () {
  const r = await fetch('data/club.json');
  if (!r.ok) {
    document.getElementById('painel-resumo').textContent = 'club.json não encontrado';
    return;
  }
  dados = await r.json();
  dados.squares.forEach(([x, y, m]) => porCoord.set(x + ',' + y, m));
  activos = (1 << dados.atletas.length) - 1;

  camadaSquares = new CamadaSquares().addTo(map);
  renderAtletas();
  renderPainel();
})();
</script>
</body>
</html>
