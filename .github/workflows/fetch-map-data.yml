name: fetch-map-data

# Caminho principal (substitui o process-kml.yml/Drive, mantido como
# fallback): fetch directo aos vector tiles da Squadrats, sem export manual.
# 2x/dia (2026-08-08, subiu de 1x): com a cache de cobertura (tiles_fetch.py)
# uma corrida normal já só custa ~2032 pedidos, não os ~6274 de antes — 2x/dia
# fica em ~4064/dia, ainda abaixo do regime antigo de 1x/dia sem cache.
# Motivo de subir: encolher a janela entre uma actividade acontecer e ser
# detectada — um atleta que sincroniza tarde ficava com o ganho atribuído ao
# dia da corrida seguinte, não ao dia real (ver daily_gains.py). Não subir
# mais sem recalcular o orçamento de pedidos/dia primeiro.
# Horas escolhidas (13h/22h UTC, não 6h/18h) para a corrida tardia ficar
# perto do fim do dia em Lisboa — apanha a maior parte do dia antes de
# qualquer detecção transitar para o dia seguinte (o "dia" do
# daily_gains.py é sempre por data UTC no INÍCIO da corrida, não hora
# local, ver fetch_club_koms.py). 22h UTC e não 23h de propósito: dá 2h de
# folga até à meia-noite UTC (a fronteira real que importa, não a meia-
# -noite local) para absorver um eventual atraso do GitHub Actions a
# disparar o cron agendado — sem SLA documentado sobre isso, e sem essa
# folga um atraso conseguia empurrar o início da corrida para o dia UTC
# seguinte, o que nenhum código nosso consegue proteger (a fronteira fica
# ultrapassada antes de o script sequer arrancar).
# Commit condicional (git diff --quiet) garante que corridas sem
# sincronização nova não geram ruído nenhum, só custo de correr.
# TODO: trigger por atividade real (Garmin/Strava/intervals.icu/calendário)
# em vez de tempo fixo, para não haver atraso entre sincronizar e o mapa
# atualizar — precisa de webhook novo, não implementado ainda (ver README
# das regras de uso do endpoint antes de desenhar isso).
# Minuto 7, não 0 (2026-08-10): ao minuto 0 em ponto é o pico de carga
# documentado do scheduler do GitHub Actions — a corrida das 13h chegou a
# atrasar-se ~52min nesse dia, e uma corrida nem chegou a disparar sozinha
# (só correu porque foi accionada à mão). Não muda as horas (13h/22h) nem
# a folga até à meia-noite UTC explicada acima (fica ~1h53 em vez de 2h,
# perda insignificante), só desvia do minuto mais concorrido.
# Nota (2026-08-12): não elimina o atraso, só afasta-o do pico — mesmo já
# no minuto 7, dia 11 Ago houve corridas ~50min e ~1h16 depois da hora
# marcada. Sem SLA do GitHub sobre isto, este desvio é mitigação, não cura.
on:
  schedule:
    - cron: "7 13,22 * * *" # 2x/dia, 13:07 e 22:07 UTC
  workflow_dispatch: {} # para correr manualmente sem esperar pelo cron

concurrency:
  group: squadrats-data-push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Um passo só, de propósito: os três consumidores partilham o varrimento
      # (ver pipeline/run_all.py). Em passos separados, cada um varria os
      # mesmos UIDs outra vez.
      - name: Varrer e gerar tudo (mapa detalhado + totais do clube + club)
        run: python3 pipeline/run_all.py data

      - name: Commitar só se houver diferença real
        run: |
          git config user.name "squadrats-bot"
          git config user.email "actions@users.noreply.github.com"

          # classification_fallbacks.json faltava aqui (2026-08-09): fica
          # sem alteração na maioria das corridas, mas quando muda ficava por
          # commitar e o `git pull --rebase` abaixo abortava com "unstaged
          # changes" — falha silenciosa, sem push, sem rasto no repo.
          FILES="data/tile_info_squadrats.json data/tile_info_squadratinhos.json data/stats.json data/squadrats.json data/trophies.json data/suggestions.json data/club.json data/daily_gains.json data/scan_cache.json data/classification_fallbacks.json"

          if git diff --quiet -- $FILES; then
            echo "sem alterações reais — nada a commitar."
            exit 0
          fi

          git add $FILES
          git commit -m "chore(data): atualizar squares via vector tiles [skip ci]"
          git pull --rebase origin master
          git push
